# Keeps the actions in .github/workflows current. Third-party actions are pinned to commit
# SHAs (a tag can be moved to point at other code); Dependabot updates the SHA and the
# version comment next to it together, so pinning does not mean falling behind.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - '*'
