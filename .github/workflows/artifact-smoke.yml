name: artifact-smoke (temporary)

on:
  pull_request:

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir -p out/.hidden
          echo "server=${{ github.server_url }} run=${{ github.run_id }}" > out/hello.txt
          echo hidden > out/.hidden/h.txt
      - uses: christopherhx/gitea-upload-artifact@9493ce5e9eb6241749e2914efc413aa831a3dc44 # v6
        with:
          name: smoke
          path: out/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: ${{ github.server_url == 'https://github.com' && 1 || 0 }}
