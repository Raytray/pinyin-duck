name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual trigger. Path filtering is bypassed in favour of the full suite so a
  # green run always means "every package checked", not "the files I touched checked".
  workflow_dispatch:

# Read-only by default. A job that needs more asks for it in its own `permissions:` block,
# which replaces this one for that job (see `changes`).
permissions:
  contents: read

concurrency:
  # Manual dispatches get their own group. Dispatching on a branch that also has
  # push activity would otherwise share a group with it, and cancel-in-progress
  # would let the two runs cancel each other mid-suite.
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && 'dispatch' || github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Detect which packages changed ────────────────────────────────────────
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # True when the run was triggered manually; downstream jobs OR this into their
      # own gates so a dispatch runs every package regardless of the diff.
      full: ${{ steps.manual.outputs.full }}
      core: ${{ steps.filter.outputs.core }}
      web: ${{ steps.filter.outputs.web }}
      android: ${{ steps.filter.outputs.android }}
      rime: ${{ steps.filter.outputs.rime }}
      root: ${{ steps.filter.outputs.root }}
    steps:
      - uses: actions/checkout@v7

      - name: Detect manual dispatch
        id: manual
        run: echo "full=${{ github.event_name == 'workflow_dispatch' }}" >> "$GITHUB_OUTPUT"

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: ${{ github.event_name != 'workflow_dispatch' }}
        with:
          filters: |
            core:
              - 'packages/core/**'
            web:
              - 'packages/web/**'
            android:
              - 'packages/android/**'
            rime:
              - 'packages/rime/**'
              - 'packages/windows/**'
              - 'packages/macos/**'
            root:
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig*.json'
              - '.oxlintrc.json'
              - 'scripts/**'
              - 'e2e/**'
              - 'playwright.config.ts'

  # ─── Root-level checks (lint + typecheck) ─────────────────────────────────
  root-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Typecheck (all workspaces)
        run: npm run typecheck

  # ─── Per-package checks (parallel matrix) ─────────────────────────────────
  package-checks:
    needs: changes
    if: ${{ needs.changes.outputs.full == 'true' || needs.changes.outputs.core == 'true' || needs.changes.outputs.web == 'true' || needs.changes.outputs.android == 'true' || needs.changes.outputs.rime == 'true' || needs.changes.outputs.root == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - core
          - web
          - android
          - rime

    name: ${{ matrix.package }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The two downloaded dictionary sources are pinned by URL and SHA-256 in sources.ts
      # and re-verified on every read, so a cache keyed on that file can never serve the
      # wrong version; it only spares GitHub a download per job. CC-CEDICT is committed.
      - name: Cache dictionary sources
        uses: actions/cache@v6
        with:
          path: packages/core/.cache
          key: dictionary-sources-${{ hashFiles('packages/core/scripts/sources.ts') }}

      # ── Build generated assets (needed by tests) ──
      # rime emits both platforms' dictionaries from the B-tree; Android also needs the
      # dictionary.btree for its asset sync.
      - name: Build dictionary assets
        if: ${{ matrix.package == 'core' || matrix.package == 'web' || matrix.package == 'android' || matrix.package == 'rime' }}
        run: |
          npm run build:dict
          npm run build:rime

      # ── Core package types ──
      # `@pinyinduck/web` imports the core entry points, whose declarations are emitted
      # by tsc. Typechecking web before core is built reports TS2307 for a module that
      # does exist, which is noise rather than a real finding.
      - name: Build core type declarations
        if: ${{ matrix.package == 'web' }}
        run: npm run build -w @pinyinduck/core

      # ── Core ──
      - name: "[core] Lint"
        if: ${{ matrix.package == 'core' }}
        run: npx oxlint packages/core

      - name: "[core] Typecheck"
        if: ${{ matrix.package == 'core' }}
        run: npm run typecheck -w @pinyinduck/core

      - name: "[core] Test + Coverage"
        if: ${{ matrix.package == 'core' }}
        run: npm run test:coverage -w @pinyinduck/core

      # ── Web ──
      - name: "[web] Lint"
        if: ${{ matrix.package == 'web' }}
        run: npx oxlint packages/web

      - name: "[web] Typecheck"
        if: ${{ matrix.package == 'web' }}
        run: npm run typecheck -w @pinyinduck/web

      - name: "[web] Build"
        if: ${{ matrix.package == 'web' }}
        run: npm run build -w @pinyinduck/web

      # ── Android ──
      - name: Setup Java
        if: ${{ matrix.package == 'android' }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        if: ${{ matrix.package == 'android' }}
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-36 ndk;27.2.12479018'

      # No golden regeneration here: build:dict reads pinned, hash-checked sources, so the
      # committed engine-parity.tsv is the golden for exactly the asset built above, and
      # PinyinEngineParityTest compares the Kotlin engine against it as committed.

      - name: "[android] Lint (ktlint via Gradle)"
        if: ${{ matrix.package == 'android' }}
        run: |
          cd packages/android
          ./gradlew ktlintCheck

      - name: "[android] Unit tests"
        if: ${{ matrix.package == 'android' }}
        run: |
          cd packages/android
          ./gradlew testDebugUnitTest

      - name: "[android] Coverage report"
        if: ${{ matrix.package == 'android' }}
        run: |
          cd packages/android
          ./gradlew jacocoTestReport

      # ── Rime (Windows + macOS) ──
      # One package builds and checks both platforms' files: they share the emitter, the
      # templates and the librime harness, and differ only in what the platform table says.
      - name: "[rime] Lint"
        if: ${{ matrix.package == 'rime' }}
        run: npx oxlint packages/rime

      - name: "[rime] Typecheck"
        if: ${{ matrix.package == 'rime' }}
        run: npm run typecheck -w @pinyinduck/rime

      - name: "[rime] Test + Coverage"
        if: ${{ matrix.package == 'rime' }}
        run: npm run test:coverage -w @pinyinduck/rime

      - name: "[rime] Update apt package lists"
        if: ${{ matrix.package == 'rime' }}
        run: sudo apt-get update

      # Builds librime once and types into both the Windows and the macOS rime/ folder.
      - name: "[rime] Rime verification"
        if: ${{ matrix.package == 'rime' }}
        run: |
          npm run setup:rime
          npm run test:rime

  # ─── Installers on their real OS ──────────────────────────────────────────
  # package-checks verifies the Rime files on Linux, but install.ps1 and install.sh only ever
  # run on Windows and macOS. Build the files once here, then run each installer on its own OS
  # against a scratch Rime folder and check what it wrote. No Weasel or Squirrel deploy: this
  # is about the files, which is where a path, quoting or BSD-vs-GNU slip would break.
  rime-files:
    needs: changes
    if: ${{ needs.changes.outputs.full == 'true' || needs.changes.outputs.core == 'true' || needs.changes.outputs.windows == 'true' || needs.changes.outputs.macos == 'true' || needs.changes.outputs.root == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache dictionary sources
        uses: actions/cache@v6
        with:
          path: packages/core/.cache
          key: dictionary-sources-${{ hashFiles('packages/core/scripts/sources.ts') }}

      - name: Build dictionary assets
        run: |
          npm run build:dict
          npm run build:rime

      - name: Upload the Rime files
        uses: actions/upload-artifact@v7
        with:
          name: rime-files
          # Both paths sit under packages/, so the artifact holds windows/rime and macos/rime.
          path: |
            packages/windows/rime
            packages/macos/rime
          retention-days: 1
          if-no-files-found: error

  installers:
    needs: rime-files
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
          - platform: macos
            os: macos-latest
    runs-on: ${{ matrix.os }}
    name: install (${{ matrix.platform }})
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # The installers merge default.custom.yaml with `npx tsx`, so they need the repo's
      # dependencies, not just the files.
      - name: Install dependencies
        run: npm ci

      - name: Download the Rime files
        uses: actions/download-artifact@v8
        with:
          name: rime-files
          path: packages

      - name: Run the installer against a scratch Rime folder
        run: node scripts/check-rime-install.mjs ${{ matrix.platform }}

  # ─── E2E tests (if web, core or root files changed) ──────────────────────────────
  e2e:
    needs: changes
    if: ${{ needs.changes.outputs.full == 'true' || needs.changes.outputs.web == 'true' || needs.changes.outputs.core == 'true' || needs.changes.outputs.root == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # The two downloaded dictionary sources are pinned by URL and SHA-256 in sources.ts
      # and re-verified on every read, so a cache keyed on that file can never serve the
      # wrong version; it only spares GitHub a download per job. CC-CEDICT is committed.
      - name: Cache dictionary sources
        uses: actions/cache@v6
        with:
          path: packages/core/.cache
          key: dictionary-sources-${{ hashFiles('packages/core/scripts/sources.ts') }}

      - name: Build dictionary assets
        run: |
          npm run build:dict
          npm run build:rime

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
