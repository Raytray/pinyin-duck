name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual trigger. Path filtering is bypassed in favour of the full suite so a
  # green run always means "every package checked", not "the files I touched checked".
  workflow_dispatch:

# Read-only by default. A job that needs more asks for it in its own `permissions:` block,
# which replaces this one for that job (see `changes`).
permissions:
  contents: read

concurrency:
  # Manual dispatches get their own group. Dispatching on a branch that also has
  # push activity would otherwise share a group with it, and cancel-in-progress
  # would let the two runs cancel each other mid-suite.
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && 'dispatch' || github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Detect which packages changed ────────────────────────────────────────
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # True when the run was triggered manually; downstream jobs OR this into their
      # own gates so a dispatch runs every package regardless of the diff.
      full: ${{ steps.manual.outputs.full }}
      core: ${{ steps.filter.outputs.core }}
      web: ${{ steps.filter.outputs.web }}
      android: ${{ steps.filter.outputs.android }}
      rime: ${{ steps.filter.outputs.rime }}
      root: ${{ steps.filter.outputs.root }}
      # JSON list of the package-checks matrix entries to run, e.g. ["web","rime"].
      packages: ${{ steps.matrix.outputs.packages }}
    steps:
      - uses: actions/checkout@v7

      - name: Detect manual dispatch
        id: manual
        run: echo "full=${{ github.event_name == 'workflow_dispatch' }}" >> "$GITHUB_OUTPUT"

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: ${{ github.event_name != 'workflow_dispatch' }}
        with:
          filters: |
            core:
              - 'packages/core/**'
            web:
              - 'packages/web/**'
            android:
              - 'packages/android/**'
            rime:
              - 'packages/rime/**'
              - 'packages/windows/**'
              - 'packages/macos/**'
            root:
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig*.json'
              - '.oxlintrc.json'
              - 'scripts/**'
              - 'e2e/**'
              - 'playwright.config.ts'

      # Turns the filter outputs into the package-checks matrix, so a change to one package
      # runs only that package's entry. A core or root change runs everything: every package
      # builds on core, and root holds the lockfile and shared config. A manual dispatch skips
      # the filter, so FULL stands in for it.
      - name: Pick the package-checks matrix
        id: matrix
        env:
          FULL: ${{ steps.manual.outputs.full }}
          CORE: ${{ steps.filter.outputs.core }}
          ROOT: ${{ steps.filter.outputs.root }}
          WEB: ${{ steps.filter.outputs.web }}
          ANDROID: ${{ steps.filter.outputs.android }}
          RIME: ${{ steps.filter.outputs.rime }}
        run: |
          packages=()
          if [[ "$FULL" == true || "$CORE" == true || "$ROOT" == true ]]; then
            packages=(core web android rime)
          else
            [[ "$WEB" == true ]] && packages+=(web)
            [[ "$ANDROID" == true ]] && packages+=(android)
            [[ "$RIME" == true ]] && packages+=(rime)
          fi
          json=$(jq -cn '$ARGS.positional' --args "${packages[@]}")
          echo "packages=$json" >> "$GITHUB_OUTPUT"
          echo "package-checks will run: $json"

  # ─── Root-level checks (lint + typecheck) ─────────────────────────────────
  root-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Typecheck (all workspaces)
        run: npm run typecheck

  # ─── Per-package checks (parallel matrix) ─────────────────────────────────
  package-checks:
    needs: changes
    if: ${{ needs.changes.outputs.packages != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.changes.outputs.packages) }}

    name: ${{ matrix.package }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The two downloaded dictionary sources are pinned by URL and SHA-256 in sources.ts
      # and re-verified on every read, so a cache keyed on that file can never serve the
      # wrong version; it only spares GitHub a download per job. CC-CEDICT is committed.
      - name: Cache dictionary sources
        uses: actions/cache@v6
        with:
          path: packages/core/.cache
          key: dictionary-sources-${{ hashFiles('packages/core/scripts/sources.ts') }}

      # ── Build generated assets (needed by tests) ──
      # rime emits both platforms' dictionaries from the B-tree; Android also needs the
      # dictionary.btree for its asset sync.
      - name: Build dictionary assets
        run: |
          npm run build:dict
          npm run build:rime

      # ── Toolchains the package's ci script needs ──
      # Only Android and Rime need anything beyond Node. These steps install tools and
      # nothing else; every check lives in the package's `ci` script, below.
      - name: Setup Java
        if: ${{ matrix.package == 'android' }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        if: ${{ matrix.package == 'android' }}
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-37.0 ndk;27.2.12479018'

      # Builds librime and the smoke harness, so the rime `ci` script's `test:rime` types
      # into a real engine instead of reporting it missing and skipping.
      - name: Build librime
        if: ${{ matrix.package == 'rime' }}
        run: |
          sudo apt-get update
          npm run setup:rime

      # ── The package's checks ──
      # Each package's `ci` script runs its checks exactly as this job does, so
      # `npm run ci -w @pinyinduck/<package>` reproduces this job locally:
      #   core:    lint, typecheck, tests with coverage
      #   web:     lint, typecheck, production build
      #   android: ktlint, unit tests, coverage report and gate (the gate fails the job when
      #            coverage drops below the floors in app/build.gradle.kts). No golden
      #            regeneration: build:dict reads pinned, hash-checked sources, so the committed
      #            engine-parity.tsv is the golden for exactly the asset built above.
      #   rime:    lint, typecheck, tests with coverage, then the librime verification, which
      #            stages both the Windows and the macOS rime/ folder and types into each.
      - name: "[${{ matrix.package }}] ci"
        run: npm run ci -w @pinyinduck/${{ matrix.package }}

  # ─── Installers on their real OS ──────────────────────────────────────────
  # package-checks verifies the Rime files on Linux, but install.ps1 and install.sh only ever
  # run on Windows and macOS. Build the files once here, then run each installer on its own OS
  # against a scratch Rime folder and check what it wrote. No Weasel or Squirrel deploy: this
  # is about the files, which is where a path, quoting or BSD-vs-GNU slip would break.
  rime-files:
    needs: changes
    # Same decision as the rime matrix entry, so the installers run whenever the files do.
    if: ${{ contains(fromJSON(needs.changes.outputs.packages), 'rime') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache dictionary sources
        uses: actions/cache@v6
        with:
          path: packages/core/.cache
          key: dictionary-sources-${{ hashFiles('packages/core/scripts/sources.ts') }}

      - name: Build dictionary assets
        run: |
          npm run build:dict
          npm run build:rime

      - name: Upload the Rime files
        # Artifact actions v4+ refuse to run off github.com (GHES check), e.g. on Forgejo.
        if: github.server_url == 'https://github.com'
        uses: actions/upload-artifact@v7
        with:
          name: rime-files
          # Both paths sit under packages/, so the artifact holds windows/rime and macos/rime.
          path: |
            packages/windows/rime
            packages/macos/rime
          retention-days: 1
          if-no-files-found: error

  installers:
    needs: rime-files
    # Needs the Rime files artifact and Windows/macOS runners: GitHub only.
    if: github.server_url == 'https://github.com'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
          - platform: macos
            os: macos-latest
          # install-from-wsl.sh, which installs the Windows files from Linux.
          - platform: wsl
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    name: install (${{ matrix.platform }})
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # The installers merge default.custom.yaml with `npx tsx`, so they need the repo's
      # dependencies, not just the files.
      - name: Install dependencies
        run: npm ci

      - name: Download the Rime files
        uses: actions/download-artifact@v8
        with:
          name: rime-files
          path: packages

      - name: Run the installer against a scratch Rime folder
        run: node scripts/check-rime-install.mjs ${{ matrix.platform }}

  # ─── E2E tests (if web, core or root files changed) ──────────────────────────────
  e2e:
    needs: changes
    if: ${{ needs.changes.outputs.full == 'true' || needs.changes.outputs.web == 'true' || needs.changes.outputs.core == 'true' || needs.changes.outputs.root == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # The two downloaded dictionary sources are pinned by URL and SHA-256 in sources.ts
      # and re-verified on every read, so a cache keyed on that file can never serve the
      # wrong version; it only spares GitHub a download per job. CC-CEDICT is committed.
      - name: Cache dictionary sources
        uses: actions/cache@v6
        with:
          path: packages/core/.cache
          key: dictionary-sources-${{ hashFiles('packages/core/scripts/sources.ts') }}

      - name: Build dictionary assets
        run: |
          npm run build:dict
          npm run build:rime

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        # Artifact actions v4+ refuse to run off github.com (GHES check), e.g. on Forgejo.
        if: always() && github.server_url == 'https://github.com'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # ─── Single required check ────────────────────────────────────────────────
  # Branch protection can't require the per-package jobs: they only exist when a PR touches
  # that package, so a required `web` check would wait forever on an Android-only PR. This
  # job always runs and reports one result. A skipped job is fine, because the change
  # detection skipped it; a failed or cancelled one fails the gate.
  ci-passed:
    if: ${{ always() }}
    needs: [changes, root-checks, package-checks, rime-files, installers, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Check every job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for result in $RESULTS; do
            if [[ "$result" != success && "$result" != skipped ]]; then
              echo "::error::a CI job ended with '$result'"
              exit 1
            fi
          done
