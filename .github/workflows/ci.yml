name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual trigger. Path filtering is bypassed in favour of the full suite so a
  # green run always means "every package checked", not "the files I touched checked".
  workflow_dispatch:

concurrency:
  # Manual dispatches get their own group. Dispatching on a branch that also has
  # push activity would otherwise share a group with it, and cancel-in-progress
  # would let the two runs cancel each other mid-suite.
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && 'dispatch' || github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Detect which packages changed ────────────────────────────────────────
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # True when the run was triggered manually; downstream jobs OR this into their
      # own gates so a dispatch runs every package regardless of the diff.
      full: ${{ steps.manual.outputs.full }}
      core: ${{ steps.filter.outputs.core }}
      web: ${{ steps.filter.outputs.web }}
      android: ${{ steps.filter.outputs.android }}
      windows: ${{ steps.filter.outputs.windows }}
      macos: ${{ steps.filter.outputs.macos }}
      root: ${{ steps.filter.outputs.root }}
    steps:
      - uses: actions/checkout@v5

      - name: Detect manual dispatch
        id: manual
        run: echo "full=${{ github.event_name == 'workflow_dispatch' }}" >> "$GITHUB_OUTPUT"

      - uses: dorny/paths-filter@v4
        id: filter
        if: ${{ github.event_name != 'workflow_dispatch' }}
        with:
          filters: |
            core:
              - 'packages/core/**'
            web:
              - 'packages/web/**'
            android:
              - 'packages/android/**'
            windows:
              - 'packages/windows/**'
            macos:
              - 'packages/macos/**'
            root:
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig*.json'
              - '.oxlintrc.json'
              - 'scripts/**'
              - 'e2e/**'
              - 'playwright.config.ts'

  # ─── Root-level checks (lint + typecheck) ─────────────────────────────────
  root-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Typecheck (all workspaces)
        run: npm run typecheck

  # ─── Per-package checks (parallel matrix) ─────────────────────────────────
  package-checks:
    needs: changes
    if: ${{ needs.changes.outputs.full == 'true' || needs.changes.outputs.core == 'true' || needs.changes.outputs.web == 'true' || needs.changes.outputs.android == 'true' || needs.changes.outputs.windows == 'true' || needs.changes.outputs.macos == 'true' || needs.changes.outputs.root == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - core
          - web
          - android
          - windows
          - macos

    name: ${{ matrix.package }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The two downloaded dictionary sources are pinned by URL and SHA-256 in sources.ts
      # and re-verified on every read, so a cache keyed on that file can never serve the
      # wrong version; it only spares GitHub a download per job. CC-CEDICT is committed.
      - name: Cache dictionary sources
        uses: actions/cache@v4
        with:
          path: packages/core/.cache
          key: dictionary-sources-${{ hashFiles('packages/core/scripts/sources.ts') }}

      # ── Build generated assets (needed by tests) ──
      # macOS emits Rime dictionaries from the same B-tree as Windows, so it needs both
      # the asset and the sibling packages' schemas staged by build:rime.
      # Android also needs the dictionary.btree for its asset sync.
      - name: Build dictionary assets
        if: ${{ matrix.package == 'core' || matrix.package == 'web' || matrix.package == 'android' || matrix.package == 'windows' || matrix.package == 'macos' }}
        run: |
          npm run build:dict
          npm run build:rime

      # ── Core package types ──
      # `@pinyinduck/web` imports the core entry points, whose declarations are emitted
      # by tsc. Typechecking web before core is built reports TS2307 for a module that
      # does exist, which is noise rather than a real finding.
      - name: Build core type declarations
        if: ${{ matrix.package == 'web' }}
        run: npm run build -w @pinyinduck/core

      # ── Core ──
      - name: "[core] Lint"
        if: ${{ matrix.package == 'core' }}
        run: npx oxlint packages/core

      - name: "[core] Typecheck"
        if: ${{ matrix.package == 'core' }}
        run: npm run typecheck -w @pinyinduck/core

      - name: "[core] Test + Coverage"
        if: ${{ matrix.package == 'core' }}
        run: npm run test:coverage -w @pinyinduck/core

      # ── Web ──
      - name: "[web] Lint"
        if: ${{ matrix.package == 'web' }}
        run: npx oxlint packages/web

      - name: "[web] Typecheck"
        if: ${{ matrix.package == 'web' }}
        run: npm run typecheck -w @pinyinduck/web

      - name: "[web] Build"
        if: ${{ matrix.package == 'web' }}
        run: npm run build -w @pinyinduck/web

      # ── Android ──
      - name: Setup Java
        if: ${{ matrix.package == 'android' }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        if: ${{ matrix.package == 'android' }}
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 ndk;27.2.12479018'

      # No golden regeneration here: build:dict reads pinned, hash-checked sources, so the
      # committed engine-parity.tsv is the golden for exactly the asset built above, and
      # PinyinEngineParityTest compares the Kotlin engine against it as committed.

      - name: "[android] Lint (ktlint via Gradle)"
        if: ${{ matrix.package == 'android' }}
        run: |
          cd packages/android
          ./gradlew ktlintCheck

      - name: "[android] Unit tests"
        if: ${{ matrix.package == 'android' }}
        run: |
          cd packages/android
          ./gradlew testDebugUnitTest

      - name: "[android] Coverage report"
        if: ${{ matrix.package == 'android' }}
        run: |
          cd packages/android
          ./gradlew jacocoTestReport

      # ── Windows ──
      - name: "[windows] Lint"
        if: ${{ matrix.package == 'windows' }}
        run: npx oxlint packages/windows

      - name: "[windows] Typecheck"
        if: ${{ matrix.package == 'windows' }}
        run: npm run typecheck -w @pinyinduck/windows

      - name: "[windows] Test + Coverage"
        if: ${{ matrix.package == 'windows' }}
        run: npm run test:coverage -w @pinyinduck/windows

      - name: "[windows] Update apt package lists"
        if: ${{ matrix.package == 'windows' }}
        run: sudo apt-get update

      - name: "[windows] Rime verification"
        if: ${{ matrix.package == 'windows' }}
        run: |
          npm run setup:rime -w @pinyinduck/windows
          npm run test:rime -w @pinyinduck/windows

      # ── macOS ──
      # Same shape as the Windows job above. The Rime step runs the non-strict variant:
      # it skips cleanly when librime could not be built, so a toolchain problem is
      # visible in the log without turning every commit red.
      - name: "[macos] Lint"
        if: ${{ matrix.package == 'macos' }}
        run: npm run lint -w @pinyinduck/macos

      - name: "[macos] Typecheck"
        if: ${{ matrix.package == 'macos' }}
        run: npm run typecheck -w @pinyinduck/macos

      - name: "[macos] Test + Coverage"
        if: ${{ matrix.package == 'macos' }}
        run: npm run test:coverage -w @pinyinduck/macos

      - name: "[macos] Install Rime build dependencies"
        if: ${{ matrix.package == 'macos' }}
        # librime 1.13.1's CMakeLists does find_package(... REQUIRED) for Boost regex,
        # YamlCpp, LevelDb, Marisa and Opencc. Boost alone is not enough: configure aborts
        # at cmake/FindYamlCpp.cmake ("Could not find yaml-cpp library") without the rest.
        # libyaml-cpp-dev on ubuntu-latest carries yaml-cpp 0.7, which satisfies the 0.5+
        # node/node.h API that FindYamlCpp.cmake requires.
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libboost-dev libboost-regex-dev \
            libgoogle-glog-dev libyaml-cpp-dev libleveldb-dev libmarisa-dev libopencc-dev \
            libluajit-5.1-dev pkg-config

      - name: "[macos] Rime verification"
        if: ${{ matrix.package == 'macos' }}
        run: |
          npm run setup:rime -w @pinyinduck/macos
          npm run test:rime -w @pinyinduck/macos

  # ─── E2E tests (if web, core or root files changed) ──────────────────────────────
  e2e:
    needs: changes
    if: ${{ needs.changes.outputs.full == 'true' || needs.changes.outputs.web == 'true' || needs.changes.outputs.core == 'true' || needs.changes.outputs.root == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # The two downloaded dictionary sources are pinned by URL and SHA-256 in sources.ts
      # and re-verified on every read, so a cache keyed on that file can never serve the
      # wrong version; it only spares GitHub a download per job. CC-CEDICT is committed.
      - name: Cache dictionary sources
        uses: actions/cache@v4
        with:
          path: packages/core/.cache
          key: dictionary-sources-${{ hashFiles('packages/core/scripts/sources.ts') }}

      - name: Build dictionary assets
        run: |
          npm run build:dict
          npm run build:rime

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
