name: Deploy web to GitHub Pages

on:
  # Deploy only what CI has passed: this starts when a CI run finishes, and the build job
  # below goes ahead only if that run succeeded on a push to main. workflow_run has no
  # `paths` filter, so every green push to main redeploys; the build is a few minutes and
  # the dictionary sources are cached.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Also runnable by hand, to re-publish without a new commit. Only from main (see `if`).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  # Never let two deploys overlap: the second one to finish would overwrite the first's
  # artifact and publish a build from a commit that is no longer HEAD.
  cancel-in-progress: false

jobs:
  build:
    # `branches: [main]` above matches the run's branch name only, and a pull request from a
    # fork can have a branch called main too. Requiring a push event in this repository
    # rules that out.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      # Build exactly the commit CI checked, not whatever main points at by now.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Same cache as CI: the downloaded sources are pinned by URL and SHA-256 in
      # sources.ts, so this only spares GitHub a download.
      - name: Cache dictionary sources
        uses: actions/cache@v6
        with:
          path: packages/core/.cache
          key: dictionary-sources-${{ hashFiles('packages/core/scripts/sources.ts') }}

      - name: Build dictionary asset
        run: npm run build:dict

      # GitHub Pages serves a project site from https://<user>.github.io/<repo>/, so the
      # bundle's asset URLs need that prefix. vite.config.ts reads it from BASE_PATH.
      - name: Build web
        run: npm run build -w @pinyinduck/web
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: packages/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Only the deploy job can publish to Pages.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
