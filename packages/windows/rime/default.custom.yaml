# Rime user configuration patch.
#
# Installed alongside the PinyinDuck schemas so the scheme switcher lists them. Rime's
# own default.yaml is rewritten by every Weasel update, so this patches it instead of
# editing it: the `+` suffix appends to a list rather than replacing it, which is what
# lets both PinyinDuck schemes and the schemes Rime ships all stay available.

patch:
  schema_list/+:
    - schema: pinyinduck
    - schema: pinyinduck_trad
  switcher/save_options/+:
    - ascii_mode
    - ascii_punct
    - full_shape
