# Rime schema — PinyinDuck (Simplified)
# encoding: utf-8
#
# PinyinDuck is a pinyin input method for Mandarin learners. Candidates are ordered by
# corpus frequency instead of by sentence probability, so the wrong homophone is never a
# guess.
#
# Two things about this schema are worth reading before changing either. One is that
# `speller/alphabet` below has no digits, and why. The other is how the English definition
# reaches the candidate list, which is a Lua filter rather than a dictionary field — see
# the note on `filters` and ../README.md, "Where the definition comes from".
#
# The dictionary this schema reads is generated from @pinyinduck/core, not hand-written:
#
#     npm run build:rime        # writes rime/pinyinduck.dict.yaml
#     npm run test:rime         # types into a real librime and checks the answers
#     powershell -File scripts/install.ps1
#
# See ../README.md for the full install and verification steps.

schema:
  schema_id: pinyinduck
  name: 拼音鸭·简
  version: "0.1"
  author:
    - PinyinDuck
  description: |
    拼音输入，按语料词频排序，可选拼音鸭·繁。
    Pinyin input ranked by corpus frequency, with a traditional variant on F4.

switches:
  - name: ascii_mode
    reset: 0
    states: [ 拼音, 西文 ]
    abbrev: [ 拼, A ]
  - name: ascii_punct
    states: [ 。，, ．， ]

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - reverse_lookup_translator
    - script_translator
  filters:
    # The gloss filter puts the English definition on each candidate, looking it up in the
    # generated lua/pinyinduck_gloss.lua by (text, code). It runs before the uniquifier so
    # the definition survives deduplication. Without librime-lua, or without the sidecar,
    # the filter is absent and candidates show their spelling instead — the schema still
    # works, it just has no definitions.
    - lua_filter@*pinyinduck_gloss_filter
    - uniquifier

speller:
  # The alphabet has no digits, and that is the whole point.
  #
  # The generated dictionary spells every reading without its tone digit (`shi`, `ni hao`),
  # so a code is only reachable if every character in it is in the alphabet. A digit typed
  # while composing is therefore not part of any code — it falls through to the selector,
  # which is what makes a number select the candidate under it. That is the behaviour the
  # rest of PinyinDuck already has, and it is why the codes are toneless in the first place.
  #
  # The cost of putting digits back would be real: a number typed while composing would
  # extend the syllable instead of selecting a candidate, so `shi2` would spell a tone
  # rather than pick the second candidate. With them absent, `shi` reaches every tone and
  # the digit keys choose among them.
  #
  # Note what the digit-free alphabet does *not* cost. Completion below is a prefix match,
  # so a tone is never required to start with: `shi` reaches `shi` and offers every tone,
  # and `sh` reaches the lot. What it does cost is nothing — multi-syllable words work
  # because the codes are toneless, so `nihao` is a prefix of `ni hao` and the space
  # delimiter never has to appear inside a word.
  alphabet: zyxwvutsrqponmlkjihgfedcba
  delimiter: " '"
  algebra:
    # The generated dictionary spells ü the standard way (lü4, nüe4); this is what lets
    # a user type it as v. The `derive` rule that rewrites ju/qu/xu/yu to jü/qü/xü is
    # deliberately absent: CC-CEDICT spells those with a plain u, so rewriting them
    # would make the most common syllables untypeable.
    - xlit/ü/v/
    # Typo tolerance, inlined from rime-luna-pinyin's pinyin.yaml so this schema does
    # not depend on that package being installed alongside it.
    - derive/un$/uen/correction
    - derive/ui$/uei/correction
    - derive/iu$/iou/correction
    - derive/([aeiou])ng$/$1gn/correction
    - derive/([dtngkhrzcs])o(u|ng)$/$1o/correction
    - derive/ong$/on/correction
    - derive/ao$/oa/correction
    - derive/([iu])a(o|ng?)$/a$1$2/correction

translator:
  dictionary: pinyinduck
  # Dictionary lookup only, one word at a time. A sentence model would offer phrases that
  # cannot be explained, which is the opposite of what a learner needs, and it would rank
  # them above the word the learner was actually reaching for.
  enable_sentence: false
  # The dictionary already ranks by corpus frequency and HSK level. Letting a user's own
  # words rewrite that order is how a learner ends up typing their own bad habits back.
  enable_user_dict: false
  # Keep offering matches for a syllable that is not finished yet (niha -> 你好), the
  # same partial match the web app makes.
  enable_completion: true
  # The longest run of pinyin treated as a single word. CC-CEDICT has a handful of
  # 10-syllable entries and nothing a learner types needs more.
  max_word_length: 10
  # How many characters of a candidate's code to echo as its comment. The gloss filter
  # overwrites that comment with the definition, so this only decides what shows when the
  # lookup misses — the spelling, which is the useful fallback. 10 covers every code the
  # dictionary emits.
  spelling_hints: 10
  # Show a comment on every candidate rather than only on the selected one.
  #
  # The comment is the English definition, put there by the `lua_filter` above from the
  # generated sidecar. librime's dictionary format has no field for a definition
  # (`RawDictEntry` is text/code/weight, and `EntryCollector` never reads a comment column
  # at any version, including master), so without that filter this would fall back to
  # showing the candidate's own code back to the user — `shi`, identical for all five of
  # 是 试 事 室 式, and carrying none of the English gloss. The column is still written to
  # the dictionary, so a librime that grows a definition field will deliver it without a
  # rebuild. See ../README.md, "Where the definition comes from".
  always_show_comments: true
  preedit_format:
    # Echo the standard spelling of what was typed as v.
    - xform/([nl])v/$1ü/

punctuator:
  import_preset: symbols

key_binder:
  import_preset: default

recognizer:
  import_preset: default

__patch:
  - pinyinduck.custom:/patch?
