# Rime schema — PinyinDuck (Simplified)
# encoding: utf-8
#
# PinyinDuck is a pinyin input method for Mandarin learners. Every candidate carries its
# tone marks and a short English definition, and candidates are ordered by corpus
# frequency instead of by sentence probability, so the wrong homophone is never a guess.
#
# The dictionary this schema reads is generated from @pinyinduck/core, not hand-written:
#
#     npm run build:rime        # writes rime/pinyinduck.dict.yaml
#     powershell -File scripts/install.ps1
#
# See ../README.md for the full install and verification steps.

schema:
  schema_id: pinyinduck
  name: 拼音鸭·简
  version: "0.1"
  author:
    - PinyinDuck
  description: |
    拼音输入，每个候选词都带声调和英文释义，按语料词频排序。
    Pinyin input where every candidate shows tone marks and an English definition.

switches:
  - name: ascii_mode
    reset: 0
    states: [ 拼音, 西文 ]
    abbrev: [ 拼, A ]
  - name: ascii_punct
    states: [ 。，, ．， ]

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - reverse_lookup_translator
    - script_translator
  filters:
    - uniquifier

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcba
  delimiter: " '"
  algebra:
    # The generated dictionary spells ü the standard way (lü4, nüe4); this is what lets
    # a user type it as v. The `derive` rule that rewrites ju/qu/xu/yu to jü/qü/xü is
    # deliberately absent: CC-CEDICT spells those with a plain u, so rewriting them
    # would make the most common syllables untypeable.
    - xlit/ü/v/
    # Typo tolerance, inlined from rime-luna-pinyin's pinyin.yaml so this schema does
    # not depend on that package being installed alongside it.
    - derive/un$/uen/correction
    - derive/ui$/uei/correction
    - derive/iu$/iou/correction
    - derive/([aeiou])ng$/$1gn/correction
    - derive/([dtngkhrzcs])o(u|ng)$/$1o/correction
    - derive/ong$/on/correction
    - derive/ao$/oa/correction
    - derive/([iu])a(o|ng?)$/a$1$2/correction

translator:
  dictionary: pinyinduck
  # Dictionary lookup only, one word at a time. A sentence model would offer phrases that
  # cannot be explained, which is the opposite of what a learner needs, and it would rank
  # them above the word the learner was actually reaching for.
  enable_sentence: false
  # The dictionary already ranks by corpus frequency and HSK level. Letting a user's own
  # words rewrite that order is how a learner ends up typing their own bad habits back.
  enable_user_dict: false
  # Keep offering matches for a syllable that is not finished yet (niha -> 你好), the
  # same partial match the web app makes.
  enable_completion: true
  # The longest run of pinyin treated as a single word. CC-CEDICT has a handful of
  # 10-syllable entries and nothing a learner types needs more.
  max_word_length: 10
  # Show the gloss on every candidate, not just the selected one: the definition is the
  # reason to choose between homophones, so hiding it behind a highlight defeats it.
  always_show_comments: true
  preedit_format:
    # Echo the standard spelling of what was typed as v.
    - xform/([nl])v/$1ü/

punctuator:
  import_preset: symbols

key_binder:
  import_preset: default

recognizer:
  import_preset: default

__patch:
  - pinyinduck.custom:/patch?
